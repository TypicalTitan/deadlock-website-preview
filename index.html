<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadlock Tournament</title>
  <meta name="description" content="A friends-only Deadlock tournament: four teams, seven weeks, one double-elimination bracket.">
  <!-- The site font, then the wireframe: every required element, unstyled. The real design replaces wireframe.css. -->
  <link rel="preload" href="./fonts/valveoracle-semibold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/wireframe.css">
  <!-- Pinned modules, no build step. htm imports Preact through this map too, so there's only ever one copy. -->
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.29.8",
        "preact/hooks": "https://esm.sh/preact@10.29.8/hooks",
        "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.118.0"
      }
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app"><p>Deadlock Tournament is loading…</p></div>
  <noscript><p>This site needs JavaScript turned on.</p></noscript>
</body>
</html>
